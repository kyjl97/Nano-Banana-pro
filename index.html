    <!-- Logic Script -->
    <script>
        // --- Elements ---
        const runBtn = document.getElementById('run-btn');
        const apiKeyInput = document.getElementById('api-key');
        const saveKeyBtn = document.getElementById('save-key-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const btnLoader = document.getElementById('btn-loader');

        const resultImage = document.getElementById('result-image');
        const defaultResultImg = document.getElementById('default-result-img');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        const useInputBtn = document.getElementById('use-input-btn');
        const downloadBtn = document.getElementById('download-btn');

        // Settings
        const ratioSelect = document.getElementById('ratio-select');
        const qualitySelect = document.getElementById('quality-select');
        const promptInput = document.getElementById('prompt-input');

        // Upload Elements
        const refSlot1 = document.getElementById('ref-slot-1');
        const refFileInput = document.getElementById('ref-file-input');
        const refSlot1Img = document.getElementById('ref-slot-1-img');
        const refSlot1Content = document.getElementById('ref-slot-1-content');

        const refSlot2 = document.getElementById('ref-slot-2');
        const refFileInput2 = document.getElementById('ref-file-input-2');
        const refSlot2Img = document.getElementById('ref-slot-2-img');
        const refSlot2Content = document.getElementById('ref-slot-2-content');

        // --- Logic: API Key Save/Load ---
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('nano_banana_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                saveKeyBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>已存</span>';
                saveKeyBtn.classList.add('text-green-500', 'bg-green-500/10');
            }
        });

        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('nano_banana_api_key', key);
                saveKeyBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>已保存</span>';
                saveKeyBtn.classList.add('text-green-500', 'bg-green-500/10');
                setTimeout(() => {
                    saveKeyBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i><span>保存</span>';
                    saveKeyBtn.classList.remove('text-green-500', 'bg-green-500/10');
                }, 2000);
            } else {
                alert("请输入 API Key 后再点击保存。");
            }
        });

        // --- Logic: Image Upload ---
        refSlot1.addEventListener('click', () => { refFileInput.click(); });
        refFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    refSlot1Img.src = event.target.result;
                    refSlot1Img.classList.remove('hidden');
                    refSlot1Content.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        refSlot2.addEventListener('click', () => { refFileInput2.click(); });
        refFileInput2.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    refSlot2Img.src = event.target.result;
                    refSlot2Img.classList.remove('hidden');
                    refSlot2Content.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        useInputBtn.addEventListener('click', () => {
            let sourceSrc = "";
            if (!resultImage.classList.contains('hidden') && resultImage.src) {
                sourceSrc = resultImage.src;
            } else {
                sourceSrc = defaultResultImg.src;
            }
            refSlot1Img.src = sourceSrc;
            refSlot1Img.classList.remove('hidden');
            refSlot1Content.classList.add('hidden');
            const icon = useInputBtn.querySelector('i');
            icon.classList.add('rotate-[-90deg]');
            setTimeout(() => icon.classList.remove('rotate-[-90deg]'), 300);
        });

        downloadBtn.addEventListener('click', async () => {
            let src = "";
            let filename = "nano-banana-result.png";

            if (!resultImage.classList.contains('hidden') && resultImage.src) {
                src = resultImage.src;
            } else {
                src = defaultResultImg.src;
            }

            if (!src) return;

            try {
                const response = await fetch(src);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                const a = document.createElement('a');
                a.href = src;
                a.target = '_blank';
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });

        // --- Logic: Async API Generation ---
        runBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            const originalPrompt = promptInput.value.trim();
            const ratio = ratioSelect.value;
            const quality = qualitySelect.value;

            if (!key) {
                alert("请输入 API Key 才能继续。");
                apiKeyInput.focus();
                return;
            }
            if (!originalPrompt) {
                alert("请输入提示词 (Prompt)。");
                promptInput.focus();
                return;
            }

            startLoading("正在提交任务...");

            // 优化 Prompt：根据选择的画质增强提示词
            let enhancedPrompt = originalPrompt;
            if (quality === '4K') {
                enhancedPrompt += ", 4k resolution, ultra detailed, masterpiece, best quality";
            } else if (quality === '2K') {
                enhancedPrompt += ", 2k resolution, high detailed, high quality";
            }
            // 1K 不做额外添加

            try {
                // Phase 1: 提交任务
                const submitUrl = "https://grsai.dakka.com.cn/v1/draw/nano-banana";
                const requestBody = {
                    prompt: enhancedPrompt,
                    aspect_ratio: ratio === 'Auto' ? '1:1' : ratio, // Auto 默认为 1:1
                    model: "nano-banana",
                    stream: false
                };

                if (!refSlot1Img.classList.contains('hidden') && refSlot1Img.src) {
                    requestBody.image = refSlot1Img.src;
                }

                console.log("提交任务:", requestBody);

                const response = await fetch(submitUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${key}`
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`提交失败: ${response.status}`);
                }

                const rawText = await response.text();
                console.log("Response Raw:", rawText);

                let taskId = null;

                try {
                    const json = JSON.parse(rawText.replace(/^data:\s*/, ''));
                    // 检查余额不足
                    if (json.msg === "insufficient credits" || json.code === -1) {
                        alert("API 错误: 余额不足 (Insufficient Credits)。\n请充值您的 API Key 额度后重试。");
                        finishLoading(false);
                        return;
                    }
                    if (json.msg && json.msg !== "success") {
                        alert("API 返回错误: " + json.msg);
                        finishLoading(false);
                        return;
                    }

                    taskId = json.id || (json.data && json.data.id);
                } catch (e) {
                    // Ignore JSON parse error
                }

                // 正则提取 ID
                if (!taskId) {
                    const idMatch = rawText.match(/"?id"?\s*:\s*"?([^",}\s]+)"?/);
                    if (idMatch && idMatch[1]) {
                        taskId = idMatch[1];
                    }
                }

                if (!taskId) {
                    alert("出错: 未能获取任务 ID。\n\n服务器返回:\n" + rawText.slice(0, 500));
                    finishLoading(false);
                    return;
                }

                console.log("成功获取 Task ID:", taskId);

                // Phase 2: 轮询结果
                await pollForResult(taskId, key);

            } catch (error) {
                console.error("Error:", error);
                alert("出错: " + error.message);
                finishLoading(false);
            }
        });

        // 轮询函数
        async function pollForResult(taskId, key) {
            const resultUrl = "https://grsai.dakka.com.cn/v1/draw/result";
            let attempts = 0;
            const maxAttempts = 60; // 最多轮询 60 次

            const check = async () => {
                loadingText.textContent = `云端生成中... (${attempts}s)`;
                attempts++;

                if (attempts > maxAttempts) {
                    throw new Error("生成超时，请稍后重试。");
                }

                try {
                    const response = await fetch(resultUrl, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${key}`
                        },
                        body: JSON.stringify({ id: taskId })
                    });

                    const json = await response.json();
                    console.log("轮询状态:", json);

                    const resultData = json.data || json;
                    const status = resultData.status;

                    if (status === 'succeeded') {
                        // 提取 URL
                        const url = resultData.results && resultData.results[0] ? resultData.results[0].url : null;
                        if (url) {
                            resultImage.src = url;
                            finishLoading(true);
                            return;
                        }
                    } else if (status === 'failed') {
                        throw new Error(`任务失败: ${resultData.failure_reason || '未知原因'}`);
                    }

                    // 继续轮询
                    setTimeout(check, 2000);

                } catch (err) {
                    console.warn("轮询出错:", err);
                    setTimeout(check, 2000);
                }
            };

            check();
        }

        function startLoading(text = "云端渲染中...") {
            runBtn.disabled = true;
            runBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.textContent = "处理中";
            btnIcon.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            resultImage.classList.add('hidden');
            resultImage.classList.remove('opacity-100');
            loadingOverlay.classList.remove('hidden');
            loadingText.textContent = text;
        }

        function finishLoading(success) {
            runBtn.disabled = false;
            runBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            btnText.textContent = "立即生成";
            btnIcon.classList.remove('hidden');
            btnLoader.classList.add('hidden');
            loadingOverlay.classList.add('hidden');

            if (success) {
                resultImage.classList.remove('hidden');
                void resultImage.offsetWidth;
                resultImage.classList.add('opacity-100');
            }
        }

        // --- Logic: Modals ---
        const donationBtn = document.getElementById('donation-btn');
        const donationModal = document.getElementById('donation-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const wechatTab = document.getElementById('wechat-tab');
        const alipayTab = document.getElementById('alipay-tab');
        const qrCodeImg = document.getElementById('qr-code-img');

        const wechatQRUrl = 'https://raw.githubusercontent.com/kyjl97/kyjl97/main/assets/logo.png';
        const alipayQRUrl = 'https://raw.githubusercontent.com/kyjl97/kyjl97/main/assets/logo.png';

        if (donationBtn && donationModal) {
            donationBtn.addEventListener('click', (e) => { e.preventDefault(); donationModal.classList.remove('hidden'); });
            closeModalBtn.addEventListener('click', () => donationModal.classList.add('hidden'));
            donationModal.addEventListener('click', (e) => { if (e.target === donationModal) donationModal.classList.add('hidden'); });

            wechatTab.addEventListener('click', () => {
                qrCodeImg.src = wechatQRUrl;
                alipayTab.className = "flex-1 p-2 text-sm font-semibold text-gray-400 hover:bg-white/5 transition-colors";
                wechatTab.className = "flex-1 p-2 text-sm font-semibold border-r border-white/10 bg-yellow-500/10 text-yellow-400 transition-colors";
            });
            alipayTab.addEventListener('click', () => {
                qrCodeImg.src = alipayQRUrl;
                wechatTab.className = "flex-1 p-2 text-sm font-semibold border-r border-white/10 text-gray-400 hover:bg-white/5 transition-colors";
                alipayTab.className = "flex-1 p-2 text-sm font-semibold bg-yellow-500/10 text-yellow-400 transition-colors";
            });
        }

        const genericModal = document.getElementById('generic-qr-modal');
        const genericModalTitle = document.getElementById('generic-modal-title');
        const genericModalQrImg = document.getElementById('generic-modal-qr-img');
        const genericModalDesc = document.getElementById('generic-modal-desc');
        const closeGenericModalBtn = document.getElementById('close-generic-modal-btn');
        const wechatPublicTrigger = document.getElementById('wechat-public-trigger');

        if (genericModal) {
            const closeQr = () => genericModal.classList.add('hidden');
            closeGenericModalBtn.addEventListener('click', closeQr);
            genericModal.addEventListener('click', (e) => { if (e.target === genericModal) closeQr(); });
        }

        if (wechatPublicTrigger) {
            wechatPublicTrigger.addEventListener('click', (e) => {
                e.preventDefault();
                genericModalTitle.textContent = '微信公众号';
                genericModalQrImg.src = 'https://raw.githubusercontent.com/kyjl97/kyjl97/main/assets/wechat-qr.png';
                genericModalDesc.textContent = '扫码关注「得救之道」';
                genericModal.classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
